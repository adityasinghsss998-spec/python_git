[project]
name = "pyhton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aditya", email = "adityasingh.sss998@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pyhton = "pyhton:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
[tool.ruff]
# Enforce modern Python syntax
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E: style errors, F: logical bugs, I: import sorting, UP: modern syntax upgrades, B: memory traps
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"